# Pinned build profile for the Doorbell (absolute A-08; decisions DL-002, DL-014).
# Board: ESP32-S3 SuperMini, built as "ESP32S3 Dev Module" with the settings verified in Discover D2,
# and the No-OTA flash layout (2 MB app / ~1.9 MB storage).
profiles:
  doorbell:
    fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=4M,PSRAM=enabled,PartitionScheme=no_ota,CPUFreq=240
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
default_profile: doorbell
