# The FIRM machine gate. Runs on every push and pull request; nobody can override it.
# Order matters (book Ch. 7): 1 integrity -> 2 absolutes -> 3 acceptance -> 4 regression.
# Protected file (A-09). Every tool is pinned and checksum-verified (A-08).
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ARDUINO_CLI_SHA256: "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out (full history, so the secret scan sees every commit)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: "1 - Integrity (A-09): nobody touched the walls"
        run: python3 checks/check_a09_integrity.py

      - name: "1b - The checks can still fail (self-tests)"
        run: python3 checks/selftest/run_selftests.py

      - name: "2 - Absolutes A-02, A-03, A-05, A-06, A-08"
        run: python3 checks/run_absolutes.py

      - name: "2 - Absolute A-01: no secrets (gitleaks, pinned)"
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

      - name: Cache the pinned ESP32 core
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: arduino-${{ env.ARDUINO_CLI_VERSION }}-${{ hashFiles('firmware/*/sketch.yaml') }}

      - name: "2 - Build the Doorbell (pinned profile) and check budget B-01"
        run: |
          curl -sSL -o arduino-cli.tgz "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          echo "${ARDUINO_CLI_SHA256}  arduino-cli.tgz" | sha256sum -c -
          tar xzf arduino-cli.tgz arduino-cli
          ./arduino-cli compile --profile doorbell firmware/doorbell 2>&1 | tee doorbell-build.log
          test "${PIPESTATUS[0]}" -eq 0
          python3 checks/check_b01_size.py doorbell-build.log

      - name: "2 - Build the Indoor Ringer (pinned profile) and check budget B-05"
        run: |
          ./arduino-cli compile --profile indoor-ringer firmware/indoor-ringer 2>&1 | tee ringer-build.log
          test "${PIPESTATUS[0]}" -eq 0
          python3 checks/check_b05_ringer_size.py ringer-build.log

      - name: "3 + 4 - Acceptance checks and regression suite (Local tier)"
        run: make -C tests/local test
